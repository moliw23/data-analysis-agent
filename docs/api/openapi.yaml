      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/ScheduleJob' }
    post:
      tags: [schedules]
      summary: 创建调度任务
      operationId: createSchedule
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleJobCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScheduleJob'

  /api/v1/schedules/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [schedules]
      summary: 任务详情
      operationId: getSchedule
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScheduleJob'
    patch:
      tags: [schedules]
      summary: 修改 cron / 参数 / 启停
      operationId: updateSchedule
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                cron: { type: string, example: '0 9 * * 1' }
                timezone: { type: string, default: Asia/Shanghai }
                params: { type: object, additionalProperties: true }
                enabled: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScheduleJob'
    delete:
      tags: [schedules]
      summary: 软删并从调度器摘除 job
      operationId: deleteSchedule
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/schedules/{id}/run:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [schedules]
      summary: 立即试跑
      operationId: runSchedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wait: { type: boolean, default: false }
      responses:
        '202':
          description: 已触发
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScheduleRun'

  /api/v1/schedules/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [schedules]
      summary: 运行历史
      operationId: listScheduleRuns
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/ScheduleRun' }

  /api/v1/schedules/{id}/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [schedules]
      summary: 单次运行详情
      operationId: getScheduleRun
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScheduleRun'

  /api/v1/schedules/{id}/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [schedules]
      summary: 取消运行
      operationId: cancelScheduleRun
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScheduleRun'

  # ────────────────────────── notifications ──────────────────────────
  /api/v1/notifications:
