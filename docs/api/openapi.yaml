openapi: 3.0.3
info:
  title: 数据分析 Agent 本地服务 API
  version: 1.0.0
  description: |
    数据分析 Agent 的本地 FastAPI 服务契约。前端据此生成 TypeScript 类型与 MSW Mock，
    后端据此实现。详见 docs/02-架构.md。

    统一约定：
    - 所有端点带 /api/v1 前缀。
    - 统一响应信封 { code, data, message }，code=0 表示成功。
    - 分页统一 { items, total, page, limit, hasMore } 置于 data 内。
    - 认证为「仅本机回环 + Origin 白名单」；标注 x-local-confirm 的端点需
      请求头 X-Local-Confirm: true。
    - 禁止静默降级：任何能力降级必须在响应字段上可见。
  contact:
    name: 高见远（首席架构师）
servers:
  - url: http://127.0.0.1:8000
    description: 本地服务（生产由本服务托管前端 dist，单端口）

tags:
  - name: health
    description: 健康检查与能力探测
  - name: settings
    description: 系统设置与隐私档位（privacy_mode 闸门的唯一管理入口）
  - name: llm
    description: LLM 网关、供应商、路由、用量与日志
  - name: conversations
    description: 会话与消息
  - name: memories
    description: 长期记忆
  - name: knowledge
    description: RAG 知识库、文档与检索
  - name: datasets
    description: 数据集元数据与服务端只读 SQL
  - name: schedules
    description: 定时调度与运行历史
  - name: notifications
    description: 调度结果推送
  - name: db-proxy
    description: 外部 MySQL/PostgreSQL 只读代理

paths:

  # ────────────────────────────── health ──────────────────────────────
  /api/v1/health:
    get:
      tags: [health]
      summary: 存活与子系统状态
      operationId: getHealth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/HealthData'

  /api/v1/meta/capabilities:
    get:
      tags: [health]
      summary: 能力清单（前端降级开关的唯一来源）
      operationId: getCapabilities
      responses:
        '200':
          description: 成功。字段必须真实反映后端探测结果，不得硬编码。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Capabilities'

  # ────────────────────────────── settings ──────────────────────────────
  /api/v1/settings/privacy-mode:
    get:
      tags: [settings]
      summary: 读取当前隐私档位及其生效边界
      operationId: getPrivacyMode
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PrivacyModeStatus'
    put:
      tags: [settings]
      summary: |
        切换隐私档位。档位必须在接口层强制生效，不得只靠前端隐藏按钮。
        strict 为默认档。降级（full/standard -> strict）不删除任何既有数据
        （本机安全策略禁止删除），仅阻断后续访问，既有数据由被阻断的
        端点返回 code=4030 并附降级提示。
      operationId: putPrivacyMode
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyModeUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PrivacyModeStatus'
        '403':
          description: 缺少 X-Local-Confirm（code=4010）

  # ────────────────────────────── llm ──────────────────────────────
  /api/v1/llm/chat:
    post:
      tags: [llm]
      summary: 非流式补全（前端 4 个钩子的统一入口）
      operationId: llmChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmChatRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/LlmChatResult'
        '502':
          description: 上游全部 provider 失败（code=4220）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/llm/chat/stream:
    post:
      tags: [llm]
      summary: SSE 流式补全
      operationId: llmChatStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmChatRequest'
      responses:
        '200':
          description: |
            text/event-stream。事件名：delta / usage / error / done。
            delta 事件 data 为 {"content":"片段"}；done 事件 data 为完整 usage。
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/llm/embeddings:
    post:
      tags: [llm]
      summary: 嵌入代理（RAG 与内置探针共用）
      operationId: llmEmbeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/EmbeddingsResult'
        '502':
          description: 上游不支持 embeddings（code=4221）。前端应切换关键词检索模式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/llm/providers:
    get:
      tags: [llm]
      summary: 列出供应商（apiKey 只返回掩码）
      operationId: listProviders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ProviderView'
    post:
      tags: [llm]
      summary: 新增供应商
      operationId: createProvider
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          apiKeyHint: { type: string, example: 'sk-****a1b2' }
        '403':
          description: 缺少 X-Local-Confirm（code=4010）

  /api/v1/llm/providers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [llm]
      summary: 更新供应商（apiKey 省略则不改）
      operationId: updateProvider
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags: [llm]
      summary: 停用供应商（软删并解除路由引用）
      operationId: deleteProvider
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/llm/providers/{id}/test:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [llm]
      summary: 连通性测试（同时探 chat 与 embeddings，结果落 embedding_probes 表）
      operationId: testProvider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                probe:
                  type: array
                  items: { type: string, enum: [chat, embeddings] }
                  default: [chat, embeddings]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          chat:
                            $ref: '#/components/schemas/ProbeResult'
                          embeddings:
                            allOf:
                              - $ref: '#/components/schemas/ProbeResult'
                              - properties:
                                  dim: { type: integer, nullable: true }

  /api/v1/llm/routes:
    get:
      tags: [llm]
      summary: 查看 taskKey 到模型的路由表
      operationId: getRoutes
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/LlmRoute'
    put:
      tags: [llm]
      summary: 覆盖式更新路由表
      operationId: putRoutes
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/LlmRoute'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/llm/usage:
    get:
      tags: [llm]
      summary: Token 用量聚合
      operationId: getUsage
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: groupBy
          in: query
          schema: { type: string, enum: [day, provider, model, task], default: day }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/UsageItem'
                          total:
                            $ref: '#/components/schemas/UsageItem'

  /api/v1/llm/logs:
    get:
      tags: [llm]
      summary: 调用日志分页
      operationId: listLlmLogs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [ok, error] }
        - name: taskKey
          in: query
          schema: { $ref: '#/components/schemas/TaskKey' }
        - name: providerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/LlmCallLog'

  # ────────────────────────── conversations ──────────────────────────
  /api/v1/conversations:
    get:
      tags: [conversations]
      summary: 会话列表
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Conversation'
    post:
      tags: [conversations]
      summary: 新建会话
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                datasetId: { type: string, format: uuid, nullable: true }
                knowledgeBaseId: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Conversation'

  /api/v1/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [conversations]
      summary: 会话详情
      operationId: getConversation
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Conversation'
        '404':
          description: 不存在（code=4040）
    patch:
      tags: [conversations]
      summary: 改名或归档
      operationId: updateConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                archived: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    delete:
      tags: [conversations]
      summary: 归档（软删，不物理删除）
      operationId: deleteConversation
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [conversations]
      summary: 消息分页（倒序）
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Message'
    post:
      tags: [conversations]
      summary: 追加消息（autoRespond 为 true 时触发网关编排）
      operationId: appendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          userMessage: { $ref: '#/components/schemas/Message' }
                          assistantMessage: { $ref: '#/components/schemas/Message' }
                          usage: { $ref: '#/components/schemas/Usage' }

  /api/v1/conversations/{id}/messages/{mid}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: mid
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [conversations]
      summary: 删除单条消息
      operationId: deleteMessage
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/conversations/{id}/context:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [conversations]
      summary: 取组装好的上下文（记忆注入 + 摘要压缩 + token 预算裁剪）
      operationId: getConversationContext
      parameters:
        - name: budgetTokens
          in: query
          schema: { type: integer, default: 4000, minimum: 500, maximum: 32000 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          messages:
                            type: array
                            items: { $ref: '#/components/schemas/ChatMessage' }
                          summary: { type: string, nullable: true }
                          injectedMemories:
                            type: array
                            items: { $ref: '#/components/schemas/Memory' }
                          estimatedTokens: { type: integer }
                          truncated: { type: boolean }

  /api/v1/conversations/{id}/summarize:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [conversations]
      summary: 手动触发滚动摘要
      operationId: summarizeConversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keepRecent: { type: integer, default: 10, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          summary: { type: string }
                          summarizedMessages: { type: integer }
                          usage: { $ref: '#/components/schemas/Usage' }

  # ────────────────────────── memories ──────────────────────────
  /api/v1/memories:
    get:
      tags: [memories]
      summary: 长期记忆列表
      operationId: listMemories
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: scope
          in: query
          schema: { type: string, enum: [global, conversation, dataset] }
        - name: conversationId
          in: query
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          schema: { type: string, enum: [fact, preference, insight] }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/Memory' }
    post:
      tags: [memories]
      summary: 手动写入记忆
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Memory'

  /api/v1/memories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [memories]
      summary: 修改内容或权重
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, maxLength: 4000 }
                weight: { type: number, minimum: 0, maximum: 10 }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    delete:
      tags: [memories]
      summary: 删除记忆
      operationId: deleteMemory
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  # ────────────────────────── knowledge ──────────────────────────
  /api/v1/knowledge-bases:
    get:
      tags: [knowledge]
      summary: 知识库列表
      operationId: listKnowledgeBases
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/KnowledgeBase' }
    post:
      tags: [knowledge]
      summary: 建库
      operationId: createKnowledgeBase
      x-privacy-capability: kb_ingest
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBaseCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeBase'
        '403':
          description: 当前档位为 strict，建库已阻断（code=4030）。建库即声明要入库内容，故与上传同档位。响应体见 components/responses/PrivacyBlocked。

  /api/v1/knowledge-bases/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [knowledge]
      summary: 知识库详情
      operationId: getKnowledgeBase
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeBase'
    patch:
      tags: [knowledge]
      summary: 改名或更换 embedding 模型（换模型后 needsReindex=true）
      operationId: updateKnowledgeBase
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                embeddingModel: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          needsReindex: { type: boolean }
    delete:
      tags: [knowledge]
      summary: 软删知识库并清空对应 Chroma collection（纯 API 调用，不删目录）
      operationId: deleteKnowledgeBase
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/knowledge-bases/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [knowledge]
      summary: 知识库统计
      operationId: getKnowledgeBaseStats
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          docCount: { type: integer }
                          chunkCount: { type: integer }
                          failedCount: { type: integer }
                          avgChunkChars: { type: number }
                          lastIngestedAt: { type: string, format: date-time, nullable: true }
                          indexReady: { type: boolean }

  /api/v1/knowledge-bases/{id}/documents:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [knowledge]
      summary: 文档列表
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, parsing, chunking, embedding, ready, failed]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/KbDocument' }
    post:
      tags: [knowledge]
      summary: 上传文档（pdf/docx/md/txt/csv）
      operationId: uploadDocument
      x-privacy-capability: kb_ingest
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 已入队
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          documentId: { type: string, format: uuid }
                          status: { type: string, enum: [queued] }
        '403':
          description: 当前档位为 strict，知识库入库已阻断（code=4030）

  /api/v1/knowledge-bases/{id}/documents/{docId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: docId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [knowledge]
      summary: 删除文档及其分块与向量（软删）
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/knowledge-bases/{id}/documents/{docId}/chunks:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: docId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [knowledge]
      summary: 分块预览
      operationId: listChunks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/KbChunk' }

  /api/v1/knowledge-bases/{id}/documents/{docId}/reprocess:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: docId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [knowledge]
      summary: 重新切分并重新嵌入
      operationId: reprocessDocument
      x-privacy-capability: kb_ingest
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chunkSize: { type: integer, minimum: 200, maximum: 4000 }
                chunkOverlap: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '403':
          description: 当前档位为 strict，重新切分与嵌入已阻断（code=4030）

  /api/v1/knowledge-bases/{id}/search:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [knowledge]
      summary: 检索（vector / keyword / hybrid 三层漏斗）
      operationId: searchKnowledgeBase
      x-privacy-capability: kb_search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 2000 }
                mode:
                  type: string
                  enum: [vector, keyword, hybrid]
                  default: hybrid
                topK: { type: integer, default: 5, minimum: 1, maximum: 20 }
                rerank: { type: boolean, default: true }
                minScore: { type: number, default: 0, minimum: 0, maximum: 1 }
      responses:
        '200':
          description: |
            成功。data.mode 为 hybrid_degraded 时表示请求了 hybrid 但向量侧不可用，
            已在 FTS5 上完成，前端必须明示降级。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum: [vector, keyword, hybrid, hybrid_degraded]
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/SearchHit' }
                          latencyMs: { type: integer }
        '409':
          description: 索引未就绪（code=4091）或维度不匹配（code=4092）
        '403':
          description: |
            当前档位为 strict，知识库检索已阻断（code=4030）。
            检索会把命中分块送入 prompt，属于外传用户内容，故与入库同档位管控。

  /api/v1/knowledge-bases/{id}/reindex:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [knowledge]
      summary: 重建全库索引（逻辑重建，全程不删除文件）
      operationId: reindexKnowledgeBase
      x-privacy-capability: kb_ingest
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      responses:
        '202':
          description: 已接受
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          jobId: { type: string }
                          status: { type: string, enum: [running] }
        '403':
          description: 当前档位为 strict，重建索引已阻断（code=4030）

  /api/v1/knowledge-bases/{id}/queries/{queryId}/feedback:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: queryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [knowledge]
      summary: 检索效果反馈（知识自演化数据源）
      operationId: feedbackQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wasUseful]
              properties:
                wasUseful: { type: boolean }
                relevanceScore: { type: number, minimum: 0, maximum: 1 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  # ────────────────────────── datasets ──────────────────────────
  /api/v1/datasets:
    get:
      tags: [datasets]
      summary: 数据集元数据列表
      operationId: listDatasets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/Dataset' }
    post:
      tags: [datasets]
      summary: |
        登记数据集元数据。只接受 schema / 行数 / sha256，
        不接受原始行数据（隐私边界由接口签名强制）。
        storageMode=server 仅在 privacy_mode=full 时被接受（请求体级闸门，
        无法由路由级 dependency 覆盖，必须在 schema/service 层校验）。
      operationId: registerDataset
      x-privacy-capability: server_dataset_register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreate'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Dataset'
        '403':
          description: storageMode=server 但档位不是 full（code=4030）。storageMode=local 在任何档位均被接受。

  /api/v1/datasets/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [datasets]
      summary: 数据集详情
      operationId: getDataset
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Dataset'
    patch:
      tags: [datasets]
      summary: 改名或修改描述
      operationId: updateDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    delete:
      tags: [datasets]
      summary: 软删元数据（浏览器明细不受影响）
      operationId: deleteDataset
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/datasets/{id}/upload:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [datasets]
      summary: 上传明细到服务端 SQLite（仅 storageMode=server 且 privacy_mode 允许）
      operationId: uploadDataset
      x-privacy-capability: server_sql
      parameters:
        - $ref: '#/components/parameters/LocalConfirm'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          rowCount: { type: integer }
                          serverTable: { type: string }
        '403':
          description: 档位不是 full，数据集明细上传已阻断（code=4030）

  /api/v1/datasets/{id}/query:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [datasets]
      summary: 服务端执行只读 SELECT（经 core/sql_guard.py 校验 + 行数上限）
      operationId: queryDataset
      x-privacy-capability: server_sql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql: { type: string, maxLength: 2000 }
                limit: { type: integer, default: 5000, minimum: 1, maximum: 50000 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SqlResult'
        '409':
          description: 数据集不在服务端（code=4090），前端应改用 alasql
        '403':
          description: 档位不是 full，服务端 SQL 已阻断（code=4030）
        '422':
          description: SQL 未通过只读白名单（code=4000）

  /api/v1/sql/validate:
    post:
      tags: [datasets]
      summary: 只读白名单校验（与前端 src/sqlGuard.js 规则保持一致）
      operationId: validateSql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql, schema]
              properties:
                sql: { type: string, maxLength: 2000 }
                schema:
                  type: object
                  required: [columns]
                  properties:
                    tableName: { type: string }
                    columns:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: { type: string }
      responses:
        '200':
          description: 校验完成（ok=false 亦返回 200，属业务校验结果）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          ok: { type: boolean }
                          sql: { type: string, nullable: true }
                          error: { type: string, nullable: true }

  /api/v1/sql/generate:
    post:
      tags: [datasets]
      summary: 自然语言转 SQL（走 text_to_sql 路由），返回前自动过 sql_guard
      operationId: generateSql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema, question]
              properties:
                datasetId: { type: string, format: uuid, nullable: true }
                schema:
                  type: object
                  properties:
                    tableName: { type: string }
                    columns:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          type: { type: string }
                          semanticRole: { type: string }
                question: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          sql: { type: string }
                          explanation: { type: string }
                          chartHint:
                            type: string
                            enum: [bar, line, pie, table, none]
                          guard:
                            type: object
                            properties:
                              ok: { type: boolean }
                              error: { type: string, nullable: true }

  # ────────────────────────── schedules ──────────────────────────
  /api/v1/schedules:
    get:
      tags: [schedules]
      summary: 调度任务列表
      operationId: listSchedules
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
